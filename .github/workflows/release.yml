name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and test
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install
          poetry run python -m unittest discover -s tests

      - name: Validate Tag Matches pyproject.toml
        run: |
          TAG_NAME="${{ github.ref_name || inputs.tag }}"
          VERSION="${TAG_NAME#v}"
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "ERROR: Tag '$TAG_NAME' does not match pyproject.toml version '$PYPROJECT_VERSION'"
            exit 1
          fi
          echo "Tag $TAG_NAME matches pyproject.toml version $PYPROJECT_VERSION"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name || inputs.tag }}"
          gh release create "$TAG_NAME"             --title "$TAG_NAME"             --generate-notes
